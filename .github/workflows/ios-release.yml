# iOS release build on a GitHub macOS runner — no Mac, no EAS quota.
#
# Replaces `eas build ios-testflight` after the free plan ran dry (2026-08:
# build 16 could not start until September). The recipe is the MegaPDF
# blueprint (../MegaPDF/docs/mobile-app-blueprint.md) adapted for Expo:
# XcodeGen becomes `expo prebuild`, everything else — manual signing on an
# accountless runner, altool with its exit-code lies guarded — is verbatim.
#
# Signing: Apple Distribution cert + "SlyTab App Store" profile from repo
# secrets (same assets credentials.json points EAS at). Cloud signing is NOT
# an option here — no Apple account lives on the runner ("No Account for
# Team"), so everything is pinned manually.
#
# The upload ends at App Store Connect processing. Attaching the build to a
# TestFlight group, beta review, and tester email stay with the worker
# tooling (scripts/worker/, scripts/ops/asc-api.sh) — a green run here does
# NOT mean testers were told.
name: iOS release

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-sign-upload:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # app.config.js keys the version injection off this — without it the
      # build would carry whatever app.json holds instead of versions.json.
      EAS_BUILD_PLATFORM: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin Xcode
        # Version heuristics pick wrong — every release exists under multiple
        # names. Pin the exact path; the listing is printed so a missing
        # version is a one-look fix.
        run: |
          ls /Applications | grep -i '^xcode' || true
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      - name: Import signing assets
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DIST_PROFILE_B64: ${{ secrets.IOS_DIST_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          printf '%s' "$IOS_DIST_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Xcode 16 reads UserData; older tooling reads MobileDevice. Both.
          UUID="30e96968-d3d0-4da9-9736-5bf3a4cca1c1"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            printf '%s' "$IOS_DIST_PROFILE_B64" | base64 -d > "$d/$UUID.mobileprovision"
          done

      - name: Archive (manual signing)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace SlyTab.xcworkspace -scheme SlyTab \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SlyTab.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=V97FBD9SXN \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="SlyTab App Store" \
            | tail -200

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>V97FBD9SXN</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ca.electricrv.slytab</key><string>SlyTab App Store</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SlyTab.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Validate and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          # validate-app is the only synchronous, verbose server check we get;
          # iTMSTransporter's CLI is a stub on modern macOS.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          # altool exits 0 on failure — grep is the real check. And "UPLOAD
          # SUCCEEDED" still only means delivered, not ingested: if the build
          # never appears in ASC, that is an async rejection (see the
          # blueprint's dylib law), not a signing problem.
          out=$(xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1) || true
          echo "$out"
          echo "$out" | grep -qE "UPLOAD FAILED|ERROR ITMS-" && exit 1
          echo "$out" | grep -q "UPLOAD SUCCEEDED"

      - name: Keep the IPA for post-mortems
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slytab-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: ignore
