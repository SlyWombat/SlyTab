# App Store screenshots from the real iOS app.
#
# Apple requires 6.9-inch iPhone screenshots and will not accept a submission
# without them. Neither the owner nor this project has an iPhone or a Mac, and
# dressing up Android or web captures as iOS would be misrepresenting one
# platform as another — which is what Apple rejects for. So this runs the
# actual iOS app in the Simulator, on the only macOS available: a GitHub
# runner, free and unmetered because this repository is public.
#
# Written without a Mac to test on, so it is built to FAIL LOUDLY AND
# COMPLETELY. Every step that can report what it saw does: the device types
# available, the contents of the build artifact, the app's own view hierarchy,
# and Maestro's debug output. One failed run should be enough to fix the cause,
# because iterating on this blind costs half an hour a time.
name: iOS App Store screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device (must be a 6.9-inch class iPhone)
        default: iPhone 16 Pro Max
        type: string

jobs:
  screenshots:
    # macOS is not optional here: the iOS Simulator does not exist elsewhere.
    runs-on: macos-15
    timeout-minutes: 75

    env:
      # The simulator and the API share a machine, so the app can talk to
      # localhost. app.config.js bakes this into the build.
      SLYTAB_API_BASE: http://127.0.0.1:8100/api/v1
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: slytab_shots
      DB_USER: slytab
      DB_PASS: ci
      MAIL_DISABLE: '1'
      FX_OFFLINE: '1'
      APP_URL: http://127.0.0.1:8100
      # Every Env::require() in api/src, so a missing one cannot surface as a
      # 500 four steps into the run. Confirmed against the list rather than
      # guessed: DB_*, INVITE_HMAC_KEY, MIGRATE_TOKEN, SESSION_PEPPER.
      # Throwaway values for a throwaway database on a throwaway runner.
      INVITE_HMAC_KEY: screenshots-only-not-a-secret
      SESSION_PEPPER: screenshots-only-not-a-secret
      MIGRATE_TOKEN: screenshots-only-not-a-secret
      JWT_SECRET: screenshots-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace deps
        run: npm ci

      # --- the demo world it will photograph --------------------------------
      - name: Start MySQL
        run: |
          brew install mysql
          brew services start mysql
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 --silent && break
            sleep 2
          done
          mysqladmin ping -h 127.0.0.1 --silent \
            || { echo "::error::MySQL never came up"; exit 1; }
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS ${DB_NAME} \
            CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          # Same shape as the e2e job in ci.yml: a named user with a password.
          # brew's MySQL starts with a passwordless root, and Env::require
          # rejects an empty DB_PASS — which is right, so give it a real one.
          mysql -h 127.0.0.1 -u root -e "
            CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}';
            GRANT ALL PRIVILEGES ON ${DB_NAME}.* TO '${DB_USER}'@'%';
            FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -u "${DB_USER}" -p"${DB_PASS}" -e "SELECT 1" "${DB_NAME}" \
            || { echo "::error::The ${DB_USER} user cannot reach ${DB_NAME}"; exit 1; }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd

      - name: Migrate and serve the API
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          php bin/migrate.php
          # PHP's built-in server is single-threaded unless told otherwise, and
          # the app opens a screen by firing five or six requests at once —
          # which it then serves one after another. That is not how production
          # behaves and it is not what these screenshots should be waiting on.
          PHP_CLI_SERVER_WORKERS=6 nohup php -S 127.0.0.1:8100 -t public > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -m 2 http://127.0.0.1:8100/api/v1/health && break
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:8100/api/v1/health \
            || { echo "::error::API never answered"; cat /tmp/php-server.log; exit 1; }

      - name: Seed the demo world
        run: |
          node scripts/docs/seed-demo.mjs --base http://127.0.0.1:8100 || {
            echo "::error::Seeding failed — the API log follows"
            tail -60 /tmp/php-server.log
            exit 1
          }

      # --- the app itself ----------------------------------------------------
      - name: Pin Xcode
        # Same pin as the release workflow: one toolchain builds this app, so
        # a screenshot never shows something a shipped build cannot.
        run: |
          ls /Applications | grep -i '^xcode' || true
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Build for the simulator
        working-directory: apps/mobile
        # Built here rather than fetched from EAS. EAS was the original path
        # and cost a build from a monthly allowance every time this flow
        # changed — for a binary the runner is perfectly capable of producing,
        # unsigned, in about the time the download took. It also removes the
        # last reason this workflow needed EXPO_TOKEN.
        #
        # SLYTAB_API_BASE is a job-level env var, so `expo prebuild` bakes it
        # into extra.apiBase (app.config.js) exactly as the eas.json profile
        # used to. Same guard as before: prove it before anything runs.
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
          xcodebuild -workspace SlyTab.xcworkspace -scheme SlyTab \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -100
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'SlyTab.app' | head -1)
          [ -n "$APP" ] || { echo "::error::No SlyTab.app was produced"; exit 1; }
          echo "$APP" > /tmp/app-path.txt
          echo "app: $APP"
          if ! grep -rq "127.0.0.1:8100" "$APP" 2>/dev/null; then
            echo "::error::The built app does not reference the local API — it is pointing at production. Check SLYTAB_API_BASE reached expo prebuild."
            exit 1
          fi
          echo "confirmed: the build targets the local API"

      - name: Boot the simulator
        run: |
          echo "--- device types available ---"
          xcrun simctl list devicetypes | grep -i iphone || true
          echo "--- runtimes available ---"
          xcrun simctl list runtimes | grep -i ios || true
          # Resolve the display name to its identifier; simctl accepts either,
          # but the failure when a name is wrong is unhelpfully terse.
          DEVTYPE=$(xcrun simctl list devicetypes --json \
            | python3 -c "
          import json,sys,os
          want = os.environ['WANT']
          for d in json.load(sys.stdin)['devicetypes']:
              if d['name'] == want:
                  print(d['identifier']); break
          " )
          if [ -z "$DEVTYPE" ]; then
            echo "::error::No simulator device type named '${{ inputs.device }}' — pick one from the list above"
            exit 1
          fi
          UDID=$(xcrun simctl create "shots" "$DEVTYPE")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # bootstatus returns as soon as the device reports booted, which is
          # earlier than the point at which it will reliably accept an
          # XCUITest runner — run 17 lost all three attempts to
          # LocalXCTestInstaller failing to start. A few seconds of settling
          # costs nothing against a fifteen-minute run.
          sleep 15
          # Deterministic status bar: 9:41, full bars, full battery — the same
          # convention Apple's own marketing uses, and it stops the clock in
          # the corner changing between runs.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --cellularMode active --cellularBars 4 \
            --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          # Stop iOS offering to save the password to iCloud Keychain.
          #
          # The app asks for that prompt on purpose — textContentType and
          # autoComplete on the password field are what make AutoFill work
          # (#99) — but it is a SYSTEM alert, drawn by another process, so
          # while it is up the app is no longer the frontmost accessibility
          # tree and Maestro can see nothing behind it. Tapping "Not Now"
          # therefore warned rather than worked: there was nothing of that name
          # in the hierarchy it could reach.
          #
          # Turning it off at the device is better than fighting it in the
          # flow, and better than weakening the app's AutoFill to suit a test.
          # Reported rather than swallowed: these were '|| true' and so it was
          # invisible that they were not reliably taking effect. The flow has a
          # guarded fallback either way.
          xcrun simctl spawn "$UDID" defaults write \
            com.apple.security.AutoFillPasswords AutoFillPasswordsEnabled -bool false \
            && echo "autofill suppressed via com.apple.security.AutoFillPasswords" \
            || echo "note: could not set com.apple.security.AutoFillPasswords"
          xcrun simctl spawn "$UDID" defaults write \
            com.apple.Preferences AutoFillPasswordsEnabled -bool false \
            && echo "autofill suppressed via com.apple.Preferences" \
            || echo "note: could not set com.apple.Preferences"
        env:
          WANT: ${{ inputs.device }}

      - name: Install and capture
        run: |
          APP=$(cat /tmp/app-path.txt)
          xcrun simctl install "$UDID" "$APP"
          # Credentials come from the seeder's own definitions rather than
          # being duplicated here, so they cannot drift apart.
          EMAIL=$(node -e "import('./scripts/docs/demo-world.mjs').then(m=>console.log(m.READER.email))")
          PASSWORD=$(node -e "import('./scripts/docs/demo-world.mjs').then(m=>console.log(m.DEMO_PASSWORD))")
          echo "signing in as $EMAIL"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version
          mkdir -p build/ios-shots
          # Maestro owns where screenshots go: it sandboxes takeScreenshot to
          # its own output folder, so a relative name lands beside the flow
          # file and an absolute one is refused outright. Both were tried.
          # Let it write where it wants, then collect.
          # Retried because Maestro's XCUITest driver sometimes fails to start
          # at all — LocalXCTestInstaller.start throwing before a single step
          # runs. That is the runner having a bad moment, not the flow being
          # wrong, and it is indistinguishable from a real failure in the exit
          # code. A whole run costs fifteen minutes; a retry costs one.
          #
          # Run 19 lost all three attempts to the driver alone, on a flow that
          # had just worked: it builds and installs an XCUITest runner into the
          # simulator, and on a loaded runner that does not always finish
          # inside Maestro's default wait. The error says so itself. Ten
          # minutes is far longer than it needs when the machine is healthy,
          # and costs nothing then — the wait ends when the driver is ready,
          # not when the clock runs out. Five attempts rather than three for
          # the same reason: this failure is transient, and a whole run is
          # fifteen minutes of a free runner.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000
          set +e
          RC=1
          for attempt in 1 2 3 4 5; do
            echo "--- maestro attempt $attempt ---"
            # Watchdog, because a failed attempt does not always end. Run
            # 32423780328 signed in, lost its XCUITest driver mid-flow
            # ("Connection refused" to the driver's own port) and then sat
            # there for seventy-five minutes until the job timeout killed it —
            # burning the whole run on an attempt that was already dead. A
            # hung attempt is now killed at fifteen minutes and retried.
            maestro --device "$UDID" test scripts/docs/ios-shots.yaml \
              -e DEMO_EMAIL="$EMAIL" -e DEMO_PASSWORD="$PASSWORD" \
              --debug-output "/tmp/maestro-debug-$attempt" \
              > "/tmp/maestro-out-$attempt.log" 2>&1 &
            MPID=$!
            WAITED=0
            while kill -0 "$MPID" 2>/dev/null; do
              sleep 10
              WAITED=$((WAITED + 10))
              if [ "$WAITED" -ge 900 ]; then
                echo "attempt $attempt has not moved in 15 minutes — killing it"
                kill -9 "$MPID" 2>/dev/null
                pkill -f maestro-driver-ios 2>/dev/null
                xcrun simctl terminate "$UDID" dev.mobile.maestro-driver-iosUITests.xctrunner 2>/dev/null
                break
              fi
            done
            wait "$MPID"; RC=$?
            cat "/tmp/maestro-out-$attempt.log"
            [ $RC -eq 0 ] && break
            # Retry ONLY when the driver never started. Retrying a flow that
            # ran and failed is actively harmful: clearState does not clear the
            # keychain, so the second attempt finds the app already signed in,
            # dies at the sign-in form, and buries the real failure under two
            # misleading ones. That happened on run 13.
            if grep -q "LocalXCTestInstaller\|restartXCTestRunner\|ConnectException\|Connection refused" \
                 "/tmp/maestro-out-$attempt.log" || [ $RC -eq 137 ]; then
              echo "driver failed to start; retrying"
              # Shut the runner down before trying again. A half-started one
              # left behind is part of why the next attempt fails the same way.
              xcrun simctl terminate "$UDID" dev.mobile.maestro-driver-iosUITests.xctrunner 2>/dev/null || true
              pkill -f maestro-driver-ios 2>/dev/null || true
              sleep 15
              continue
            fi
            echo "the flow ran and failed on its own terms — not retrying"
            break
          done
          set -e

          # Collected even when the flow failed part way, so a run that gets
          # three screenshots in still hands over three screenshots.
          echo "--- collecting captures ---"
          find /tmp/maestro-debug* ~/.maestro "$HOME/.maestro" scripts/docs \
            -name '*.png' -newermt '-30 minutes' 2>/dev/null \
            | grep -viE 'failure|hierarchy' \
            | while read -r f; do
                cp -n "$f" build/ios-shots/ 2>/dev/null || true
              done
          ls -la build/ios-shots || true
          exit $RC

      - name: What the app actually showed
        # The whole point of this step: when a tap fails it is because the label
        # differs from what the flow expects, and only the hierarchy says how.
        if: failure()
        run: |
          echo "--- current view hierarchy ---"
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "$UDID" hierarchy 2>&1 | head -200 || true
          echo "--- last screen ---"
          mkdir -p build/ios-shots
          xcrun simctl io "$UDID" screenshot build/ios-shots/zz-failure-state.png || true
          echo "--- app logs ---"
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'processImagePath CONTAINS "SlyTab"' 2>&1 | tail -80 || true

      - name: Report what was captured
        if: always()
        run: |
          ls -la build/ios-shots 2>/dev/null || echo "no screenshots produced"
          for f in build/ios-shots/*.png; do
            [ -e "$f" ] || continue
            echo "$f  $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' ')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            build/ios-shots/
            scripts/docs/build/
            /tmp/maestro-debug*/
            /tmp/php-server.log
            /tmp/build.json
          if-no-files-found: warn
