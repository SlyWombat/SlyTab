# App Store screenshots, captured from the real iOS app in a simulator.
#
# Driven by accessibility label rather than coordinates: the app labels its
# controls properly (that work was done for #79), so this survives layout
# changes in a way that tapping at x,y would not.
#
# The app under test points at a locally seeded demo world — see
# SLYTAB_API_BASE in app.config.js. Nothing here touches production, and no
# real person's spending can reach a store listing.
appId: ca.electricrv.slytab
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# --- sign in as the demo reader ---------------------------------------------
# The app opens straight onto the form with both fields visible, so there is
# nothing to tap first. Email and password sign-in exists on iOS — only the
# social providers differ there (Apple yes, Google no).
# By testID, not by text: the visible "Email" is a label sibling to the input,
# so tapping the text focused nothing and the form was submitted empty.
# Tap the email field, type, then press return to reach the password field.
#
# The password box cannot be focused by tapping it from a driver — on neither
# platform. Runs 32415822387, 32417489636 and 32420093703 all photographed the
# same thing: email filled, password empty, "email or password is incorrect",
# and (with a debug shot at the moment of the tap) no keyboard and no focus
# ring on the field that had just been tapped. Tapping coordinates would paper
# over it in this flow only. Instead the app now does what its own returnKeyType
# has been promising since #99 — return moves to the password field — and both
# capture flows use it.
# Only when there is a form to fill. `clearState` does not clear the
# keychain, so a retried attempt comes back already signed in — and every
# retry used to die on a sign-in screen that was no longer there, burying
# whatever had actually gone wrong the first time.
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - tapOn:
          id: "Email"
      - inputText: "${DEMO_EMAIL}"
      - pressKey: Enter
      - takeScreenshot: debug-password-focus
      - inputText: "${DEMO_PASSWORD}"
      - hideKeyboard
      - tapOn: "Sign in"
      # Say why it failed, rather than leaving it to be inferred from a later
      # assertion about a tab bar that was never going to appear.
      - assertNotVisible: "email or password is incorrect"
# Let the sign-in actually finish before the app is killed.
#
# Tapping Sign in only STARTS the request. Stopping the app immediately killed
# it before the token reached the keychain, so the restart came back to an
# empty sign-in form — which looked exactly like the restart trick not working,
# when in fact it had never been given a session to restore.
#
# Optional, so it costs nothing when no alert appears: the tab bar shows up and
# this returns at once. When the alert IS up it waits the timeout out, by which
# point the request has completed either way.
- extendedWaitUntil:
    visible: "Groups"
    timeout: 20000
    optional: true

# iOS offers to save the password to iCloud Keychain the moment a signed-in
# form is submitted — a system alert, drawn above the app, which is why the
# run reached Home and still could not see the tab bar behind it. The app
# invites it by design: textContentType/autoComplete on the password field is
# what makes AutoFill work (#99), so the prompt is correct behaviour and the
# flow simply has to dismiss it.
# Sidestep the save-password alert instead of fighting it.
#
# It is a system alert drawn by another process: it never appears in the app's
# hierarchy, so it cannot be tapped by name, and tapping its coordinates
# worked on one run and not the next. Both were tried.
#
# The sign-in itself already succeeded before the alert appears — it is offering
# to remember a password that has been accepted. So: stop the app and start it
# again. The session is in the keychain, the app comes back signed in, and
# there is no password field and therefore no alert. Deterministic, and it
# needs nothing from the app that real use does not already do.
- stopApp
- launchApp
# If the session did not survive the restart, sign in again rather than
# failing: the block is conditional either way, so this costs nothing when the
# keychain behaved.
# Only when there is a form to fill. `clearState` does not clear the
# keychain, so a retried attempt comes back already signed in — and every
# retry used to die on a sign-in screen that was no longer there, burying
# whatever had actually gone wrong the first time.
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - tapOn:
          id: "Email"
      - inputText: "${DEMO_EMAIL}"
      - pressKey: Enter
      - takeScreenshot: debug-password-focus
      - inputText: "${DEMO_PASSWORD}"
      - hideKeyboard
      - tapOn: "Sign in"
      # Say why it failed, rather than leaving it to be inferred from a later
      # assertion about a tab bar that was never going to appear.
      - assertNotVisible: "email or password is incorrect"
# 90s, not 30: a cold start on a busy macOS runner is slow, and run
# 32432778534 died here with the app perfectly healthy — the failure
# screenshot taken moments later shows Home, signed in, tab bar and all.
- extendedWaitUntil:
    visible: "Groups"
    timeout: 90000

# --- 1. Home: what you are owed, across every group -------------------------
# Wait for the home data, not just the shell. "Groups" is a tab label and is
# on screen before anything has loaded, so asserting it proves only that the
# app started — run 21 photographed a spinner and an empty page. A group name
# cannot appear until the balances have actually arrived.
- extendedWaitUntil:
    visible: ".*Cottage Trip.*"
    timeout: 60000
- takeScreenshot: 01-home

# --- 2. A group's expenses --------------------------------------------------
# By testID: "Groups" also names a section heading on Home, so matching the
# tab by its text alone is ambiguous.
- tapOn:
    id: "tab-groups"
# Matched as a regex, not exact text. A group row is one merged accessibility
# element on iOS, so its name is only ever a SUBSTRING of the label — which is
# why an exact match failed against a screen that plainly showed the group.
# 40s, not 15: the API here is PHP's built-in server, which handles one request
# at a time, and the group list fans out several at once. The list was on
# screen in the failure capture — this timed out waiting for it, it was never
# missing.
- extendedWaitUntil:
    visible: ".*Cottage Trip.*"
    timeout: 40000
- tapOn: ".*Cottage Trip.*"
- extendedWaitUntil:
    visible: "Balances"
    timeout: 15000
- takeScreenshot: 02-group-expenses

# --- 3. Balances and the settle-up plan -------------------------------------
- tapOn: "Balances"
- takeScreenshot: 03-balances

# --- 4. Recording money someone handed you (#120) ---------------------------
# Tapping a person's balance is the new entry point, and a listing should show
# it rather than describe it. Optional throughout: a missed sheet costs one
# picture, not the whole run.
- tapOn:
    text: "Alice"
    optional: true
- extendedWaitUntil:
    visible: "Record money received"
    timeout: 15000
    optional: true
- takeScreenshot: 04-settle
- tapOn:
    text: "Close"
    optional: true

# --- 5. Totals --------------------------------------------------------------
- tapOn:
    text: "Totals"
    optional: true
- takeScreenshot: 05-totals

# --- 6. Adding an expense, with the split controls on screen ----------------
- tapOn: "Expenses"
- tapOn: "Add expense"
- extendedWaitUntil:
    visible: "New expense"
    timeout: 15000
# Type an amount, so the sheet is photographed mid-use. Left blank, the save
# button is disabled and the screenshot reads as a broken screen.
# Matched as a prefix: Field names its input after its label, and this one
# carries the currency — "Amount (CAD)" — whose brackets are regex characters.
- tapOn:
    id: "Amount.*"
- inputText: "84.20"
# Dismiss the decimal pad by tapping inert content INSIDE the scroll view. It
# has no return key, so hideKeyboard cannot close it (run 20), and the sheet
# title sits outside the ScrollView so tapping that did nothing (run 21) —
# leaving the keyboard over the split rows and the save button. A plain Text
# inside is not "handled" by a child, which is what dismisses it.
- tapOn:
    text: "Split equally.*"
- takeScreenshot: 06-add-expense
- tapOn: "Close"

# --- 6. The activity feed ---------------------------------------------------
# Leave the group first. "Activity" names BOTH a tab inside a group and a
# destination in the bottom bar, so tapping it while still in the group would
# hit the wrong one — and would have done so silently, producing a screenshot
# of the right name showing the wrong screen.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 15000
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 15000
- takeScreenshot: 07-activity
