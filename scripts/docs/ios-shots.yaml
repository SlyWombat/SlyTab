# App Store screenshots, captured from the real iOS app in a simulator.
#
# Driven by accessibility label rather than coordinates: the app labels its
# controls properly (that work was done for #79), so this survives layout
# changes in a way that tapping at x,y would not.
#
# The app under test points at a locally seeded demo world — see
# SLYTAB_API_BASE in app.config.js. Nothing here touches production, and no
# real person's spending can reach a store listing.
appId: ca.electricrv.slytab
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# --- sign in as the demo reader ---------------------------------------------
# The app opens straight onto the form with both fields visible, so there is
# nothing to tap first. Email and password sign-in exists on iOS — only the
# social providers differ there (Apple yes, Google no).
# By testID, not by text: the visible "Email" is a label sibling to the input,
# so tapping the text focused nothing and the form was submitted empty.
- tapOn:
    id: "Email"
- inputText: "${DEMO_EMAIL}"
- tapOn:
    id: "Password"
- inputText: "${DEMO_PASSWORD}"
- hideKeyboard
- tapOn: "Sign in"
# iOS offers to save the password to iCloud Keychain the moment a signed-in
# form is submitted — a system alert, drawn above the app, which is why the
# run reached Home and still could not see the tab bar behind it. The app
# invites it by design: textContentType/autoComplete on the password field is
# what makes AutoFill work (#99), so the prompt is correct behaviour and the
# flow simply has to dismiss it.
# Dismiss the save-password alert, but only when it is actually in the way.
#
# It is a system alert drawn by another process, so it never appears in the
# app's hierarchy and cannot be tapped by name — "Not Now" is not there to
# find. The device setting that should suppress it is unreliable: it worked on
# one run and not the next, with nothing changed.
#
# So this taps where the button is, guarded by `notVisible: Groups`. The guard
# is what makes a coordinate tap acceptable: when no alert is up the tab bar is
# visible, the block is skipped entirely, and there is no blind tap landing on
# whatever happens to sit at those coordinates. When the alert IS up, Groups is
# exactly what it is covering.
#
# Percentages rather than pixels so this does not silently become wrong on a
# different device size.
- runFlow:
    when:
      notVisible: "Groups"
    commands:
      - tapOn:
          point: "33%,61%"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 30000

# --- 1. Home: what you are owed, across every group -------------------------
- takeScreenshot: 01-home

# --- 2. A group's expenses --------------------------------------------------
# By testID: "Groups" also names a section heading on Home, so matching the
# tab by its text alone is ambiguous.
- tapOn:
    id: "tab-groups"
# Matched as a regex, not exact text. A group row is one merged accessibility
# element on iOS, so its name is only ever a SUBSTRING of the label — which is
# why an exact match failed against a screen that plainly showed the group.
# 40s, not 15: the API here is PHP's built-in server, which handles one request
# at a time, and the group list fans out several at once. The list was on
# screen in the failure capture — this timed out waiting for it, it was never
# missing.
- extendedWaitUntil:
    visible: ".*Cottage Trip.*"
    timeout: 40000
- tapOn: ".*Cottage Trip.*"
- extendedWaitUntil:
    visible: "Balances"
    timeout: 15000
- takeScreenshot: 02-group-expenses

# --- 3. Balances and the settle-up plan -------------------------------------
- tapOn: "Balances"
- takeScreenshot: 03-balances

# --- 4. Totals --------------------------------------------------------------
- tapOn:
    text: "Totals"
    optional: true
- takeScreenshot: 04-totals

# --- 5. Adding an expense, with the split controls on screen ----------------
- tapOn: "Expenses"
- tapOn: "Add expense"
- extendedWaitUntil:
    visible: "New expense"
    timeout: 15000
- takeScreenshot: 05-add-expense
- tapOn: "Close"

# --- 6. The activity feed ---------------------------------------------------
# Leave the group first. "Activity" names BOTH a tab inside a group and a
# destination in the bottom bar, so tapping it while still in the group would
# hit the wrong one — and would have done so silently, producing a screenshot
# of the right name showing the wrong screen.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 15000
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 15000
- takeScreenshot: 06-activity
